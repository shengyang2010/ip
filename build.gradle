plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'mybff.MyBff'
}

// Keep the regular JAR separate from the runnable distribution JAR.
tasks.named('jar') {
    archiveClassifier = 'plain'
}

tasks.named('shadowJar') {
    archiveFileName = 'mybff.jar'
}
